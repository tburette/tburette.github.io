    <style>

  <body>
    <header>
      <div class="filters">
        <select id="categoryFilter">
          <option value="">Toutes catégories</option>
        </select>

        <select id="cityFilter">
          <option value="">Toutes villes</option>
        </select>

        <label>
          <input type="checkbox" id="onlineOnly" />
          En ligne uniquement
        </label>

        <div>
          <input
            type="range"
            id="distanceFilter"
            min="0"
            max="200"
            value="200"
          />
          <div class="distance-label">
            Distance max : <span id="distanceValue">200</span> km
          </div>
        </div>

        <select id="sortBy">
          <option value="distance">Distance</option>
          <option value="name">Nom</option>
          <option value="category">Catégorie</option>
        </select>

        <input type="text" id="searchInput" placeholder="Recherche..." />
      </div>
    </header>

    <div class="layout">
      <div id="map"></div>

      <div class="list-panel">
        <div class="stats" id="stats"></div>

        <div id="activitiesContainer"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      /* ==========================================================
      CONFIG
      ========================================================== */

      const USER_LAT = 45.750917;
      const USER_LON = 4.855639;

      /* ==========================================================
      HELPERS
      ========================================================== */

      function safe(v, fallback = "") {
        return v ?? fallback;
      }

      function cleanAge(age) {
        if ([0, 99].includes(age)) return "";
        return safe(age);
      }

      function truncate(text, max = 300) {
        if (!text) return "";
        return text.length > max ? text.slice(0, max) + "..." : text;
      }

      function toNumber(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }

      function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371;

        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;

        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLon / 2) ** 2;

        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
      }

      function normalizeUrl(url) {
        if (!url) return null;

        if (url.startsWith("http://") || url.startsWith("https://")) {
          return url;
        }

        return "https://" + url;
      }

      function escapeHtml(str) {
        return String(str ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      /* ==========================================================
      NORMALISATION
      ========================================================== */

      const normalizedActivities = activities.map((a, index) => {
        const lat = toNumber(a?.location?.position?.latitude);
        const lon = toNumber(a?.location?.position?.longitude);

        let distance = Infinity;

        if (lat !== null && lon !== null && !a?.location?.isOnline) {
          distance = haversine(USER_LAT, USER_LON, lat, lon);
        }

        return {
          raw: a,
          idx: index,

          id: a?.id,

          name: safe(a?.name, "Sans nom"),
          offerTerms: safe(a?.offerTerms),

          freePersonCount: safe(a?.freePersonCount),
          freeSessionCount: safe(a?.freeSessionCount),

          get: safe(a?.get),
          payFor: safe(a?.payFor),

          category: safe(a?.category?.name),
          subcategory: safe(a?.subcategory?.name),

          locationName: safe(a?.location?.name),

          address: safe(a?.location?.address1),
          postCode: safe(a?.location?.postCode),
          city: safe(a?.location?.city),
          county: safe(a?.location?.county),
          region: safe(a?.location?.region),

          website: normalizeUrl(a?.location?.website),

          email: safe(a?.location?.email),
          phone: safe(a?.location?.phoneNumber),

          lat,
          lon,

          logoUrl: a?.location?.logoUrl || null,
          mainImageUrl: a?.location?.mainImageUrl || null,

          ageFrom: cleanAge(a?.ageFrom),
          ageTo: cleanAge(a?.ageTo),

          tags: Array.isArray(a?.tags)
            ? a.tags.map((t) => t?.title).filter(Boolean)
            : [],

          isOnline: Boolean(a?.location?.isOnline),

          distance,
        };
      });

      /* ==========================================================
      FILTERS
      ========================================================== */

      const categoryFilter = document.getElementById("categoryFilter");

      const cityFilter = document.getElementById("cityFilter");

      const onlineOnly = document.getElementById("onlineOnly");

      const distanceFilter = document.getElementById("distanceFilter");

      const distanceValue = document.getElementById("distanceValue");

      const sortBy = document.getElementById("sortBy");

      const searchInput = document.getElementById("searchInput");

      const container = document.getElementById("activitiesContainer");

      const stats = document.getElementById("stats");

      /* ==========================================================
      POPULATE FILTERS
      ========================================================== */

      [
        ...new Set(
          normalizedActivities
            .map((x) => x.category)
            .filter(Boolean)
            .sort(),
        ),
      ].forEach((cat) => {
        categoryFilter.add(new Option(cat, cat));
      });

      [
        ...new Set(
          normalizedActivities
            .map((x) => x.city)
            .filter(Boolean)
            .sort(),
        ),
      ].forEach((city) => {
        cityFilter.add(new Option(city, city));
      });

      /* ==========================================================
      MAP
      ========================================================== */

      const map = L.map("map");

      map.setView([USER_LAT, USER_LON], 12);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap",
      }).addTo(map);

      const userIcon = L.divIcon({
        className: "user-marker",
        html: '<div class="user-dot"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10],
      });

      L.marker([USER_LAT, USER_LON], { icon: userIcon })
        .addTo(map)
        .bindPopup("<b>Votre position</b>");

      let markerLayer = L.layerGroup().addTo(map);

      /* ==========================================================
      RENDER
      ========================================================== */

      function getFilteredData() {
        const category = categoryFilter.value;

        const city = cityFilter.value;

        const maxDistance = Number(distanceFilter.value);

        const q = searchInput.value.trim().toLowerCase();

        let rows = normalizedActivities.filter((item) => {
          if (category && item.category !== category) {
            return false;
          }

          if (city && item.city !== city) {
            return false;
          }

          if (onlineOnly.checked && !item.isOnline) {
            return false;
          }

          if (!item.isOnline && item.distance > maxDistance) {
            return false;
          }

          if (q) {
            const blob = [
              item.name,
              item.offerTerms,
              item.category,
              item.subcategory,
              item.locationName,
              item.city,
            ]
              .join(" ")
              .toLowerCase();

            if (!blob.includes(q)) {
              return false;
            }
          }

          return true;
        });

        switch (sortBy.value) {
          case "name":
            rows.sort((a, b) => a.name.localeCompare(b.name, "fr"));
            break;

          case "category":
            rows.sort((a, b) =>
              (a.category || "").localeCompare(b.category || "", "fr"),
            );
            break;

          default:
            rows.sort((a, b) => a.distance - b.distance);
        }

        return rows;
      }

      function render() {
        const data = getFilteredData();

        stats.textContent = `${data.length} activité(s) affichée(s)`;

        markerLayer.clearLayers();

        container.innerHTML = "";

        data.forEach((item) => {
          const card = document.createElement("div");
          card.className = "activity";
          card.id = "activity-" + item.idx;

          card.innerHTML = `
         <div class="activity-header">

           ${
             item.mainImageUrl
               ? `<img class="main-image" src="${item.mainImageUrl}" loading="lazy">`
               : `<div class="main-image empty-image">Pas d'image</div>`
           }

           <div class="info">

             <div class="top-row">

               <div class="top-main">

                 <h2>${escapeHtml(item.name)}</h2>

                 <div class="badges">
                   ${
                     item.category
                       ? `<span class="badge">${escapeHtml(item.category)}</span>`
                       : ""
                   }

                   ${
                     item.subcategory
                       ? `<span class="badge">${escapeHtml(item.subcategory)}</span>`
                       : ""
                   }

                   ${"" /*item.isOnline ? `<span class="badge">En ligne</span>` : ""*/}

                   ${
                     Math.max(item.freeSessionCount || 0) > 1
                       ? `<span class="multi-free">${item.freeSessionCount}×</span>`
                       : ""
                   }

                   ${
                     Math.min(item.get || 0, item.payFor || 0) >= 1
                       ? `<span class="must-buy">buy ${item.payFor} to get ${item.get}</span>`
                       : ""
                   }
                 </div>

                 <div class="primary-meta">

                   <div><strong>${escapeHtml(item.locationName)}</strong></div>

                   <div>
                     ${
                       item.isOnline
                         ? "Activité en ligne"
                         : `${escapeHtml(item.address)}${item.city ? " - " + escapeHtml(item.city) : ""}`
                     }
                   </div>

                   <div class="distance">
                     ${
                       item.isOnline
                         ? "En ligne"
                         : item.distance.toFixed(1) + " km"
                     }
                   </div>

                   ${
                     item.website
                       ? `<div><a href="${item.website}" target="_blank" rel="noopener">Site web</a></div>`
                       : ""
                   }

                ${
                  item.ageFrom || item.ageTo
                    ? ` <div>
                 ${item.ageFrom ?? "?"}
                 -
                 ${item.ageTo ?? "?"}
               </div>`
                    : ""
                }


                 </div>

               </div>

               ${
                 item.logoUrl
                   ? `<img class="logo" src="${item.logoUrl}" loading="lazy">`
                   : `<div class="logo empty-image"></div>`
               }

             </div>

             <div class="offer-preview">
               ${escapeHtml(truncate(item.offerTerms))}
             </div>

           </div>

         </div>

         <details>
           <summary>Détails</summary>

           <div class="details-content">

             <div class="details-grid">

               <div class="label">Adresse</div>
               <div>
                 ${escapeHtml(item.address)}
               </div>

               <div class="label">Ville</div>
               <div>
                 ${escapeHtml(item.city)}
               </div>

               <div class="label">Région</div>
               <div>
                 ${escapeHtml(item.region)}
               </div>

               <div class="label">Téléphone</div>
               <div>
                 ${escapeHtml(item.phone)}
               </div>

               <div class="label">Email</div>
               <div>
                 ${escapeHtml(item.email)}
               </div>

               <div class="label">Site web</div>
               <div>
                 ${
                   item.website
                     ? `
                   <a
                     class="website-link"
                     href="${item.website}"
                     target="_blank"
                   >
                     ${escapeHtml(item.website)}
                   </a>`
                     : ""
                 }
               </div>

               <div class="label">Âge</div>
               <div>
                 ${item.ageFrom ?? "?"}
                 -
                 ${item.ageTo ?? "?"}
               </div>

               <div class="label">Coordonnées</div>
               <div>
                 ${item.lat ?? "-"},
                 ${item.lon ?? "-"}
               </div>

               <div class="label">Tags</div>
               <div>
                 ${escapeHtml(item.tags.join(", "))}
               </div>

             </div>

             <h3>Description complète</h3>

             <div class="offer-full">
               ${escapeHtml(item.offerTerms)}
             </div>

           </div>

         </details>
       `;

          container.appendChild(card);

          if (item.lat !== null && item.lon !== null && !item.isOnline) {
            const popupHtml = `
           <div class="marker-popup">


             ${escapeHtml(item.locationName)}

             <div>
               <strong>${escapeHtml(item.name)}</strong>
             </div>

             ${
               item.website
                 ? `
               <div>
                 <a
                   href="${item.website}"
                   target="_blank"
                 >
                   Site web
                 </a>
               </div>`
                 : ""
             }

             <br>

             <button
               onclick="
                 document
                   .getElementById('activity-${item.idx}')
                   .scrollIntoView({
                     behavior:'smooth',
                     block:'center'
                   });
               "
             >
               Voir la fiche
             </button>

           </div>
         `;

            L.marker([item.lat, item.lon])
              .bindPopup(popupHtml)
              .addTo(markerLayer);
          }
        });
      }

      /* ==========================================================
      EVENTS
      ========================================================== */

      [categoryFilter, cityFilter, onlineOnly, sortBy, searchInput].forEach(
        (el) => {
          el.addEventListener("input", render);
          el.addEventListener("change", render);
        },
      );

      distanceFilter.addEventListener("input", () => {
        distanceValue.textContent = distanceFilter.value;
        render();
      });

      render();
    </script>
  </body>
</html>
